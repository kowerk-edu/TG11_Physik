<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps für den Physikunterricht</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #102a43; background: #f5f8fb; }
    body { margin: 0; padding: 24px; }
    main { max-width: 760px; margin: auto; }
    h1 { margin-top: 0; }
    .grid { display: grid; gap: 14px; }
    a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 14px; border: 1px solid #cbd9e6; border-radius: 14px; color: inherit; background: white; text-decoration: none; }
    a:hover, a:focus-visible { border-color: #2b79b9; background: #f1f8ff; }
    strong { font-size: 1.08rem; }
    span { color: #53708a; }
    b { color: #1769a6; }
    @media (max-width: 520px) { a { grid-template-columns: 1fr; } b { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Apps für den Physikunterricht</h1>
    <p>Die folgenden Links öffnen die jeweilige App-Store-Seite in einem neuen Tab.</p>
    <div class="grid">
      <a href="https://apps.apple.com/de/app/viana-2/id1554845327" target="_blank" rel="noopener">
        <span><strong>Viana 2</strong><br>Videoanalyse für den Physikunterricht</span><b>Öffnen ↗</b>
      </a>
      <a href="https://apps.apple.com/de/app/phyphox/id1127319693" target="_blank" rel="noopener">
        <span><strong>phyphox</strong><br>Smartphone-Sensoren für Experimente</span><b>Öffnen ↗</b>
      </a>
      <a href="https://apps.apple.com/de/app/sparkvue/id361907181" target="_blank" rel="noopener">
        <span><strong>SPARKvue</strong><br>Messwerterfassung und Auswertung</span><b>Öffnen ↗</b>
      </a>
    </div>
  </main>
</body>
</html>
